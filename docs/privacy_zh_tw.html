    <section>
        <h2>1. 關於資料收集</h2>
        <p><strong>見開PDF實用工具</strong>不會收集、儲存或分享任何個人資訊。所有PDF處理均在您的裝置本機執行，絕不會上傳到外部伺服器。</p>
    </section>

    <section>
        <h2>2. 關於應用程式內購</h2>
        <p>本應用程式包含用於支援開發的可選內購（打賞），由Google Play結算系統安全處理。</p>
    </section>

    </section>
