name: CI

on:
  push:
    branches: [ main, testing ]
  pull_request:
    branches: [ main, testing ]

# 同じブランチ/PRへの重複した実行をキャンセル
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'jetbrains'
        java-version: '21'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v6

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug

    - name: Run Android Lint
      run: ./gradlew lintDebug

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

    - name: Validate translations, store metadata and public pages
      run: |
        python3 scripts/validate_localized_strings.py
        python3 scripts/validate_plurals.py
        python3 scripts/audit_english_residue.py
        python3 scripts/validate_store_metadata.py
        python3 scripts/validate_public_pages.py
        python3 scripts/verify_sample_release_assets.py
        python3 -m unittest discover -s scripts -p 'test_sample_public_catalog.py'
        python3 scripts/update_docs_and_listings.py

    - name: Test safe device and document scripts
      run: |
        python3 -m unittest discover -s scripts -p 'test_run_device_tests_and_save.py'
        python3 -m unittest discover -s scripts -p 'test_update_docs_and_listings.py'
